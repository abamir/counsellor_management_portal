<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Counsellor Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body, html {
          height: 100%;
          margin: 0;
          font-family: 'Poppins', sans-serif;
          background: linear-gradient(to right, #f3f4f6, #e0f7fa);
        }
        .split-layout {
          display: flex;
          min-height: 100vh;
        }
        .left-panel {
          flex: 1;
          background: linear-gradient(to bottom right, #6a11cb, #2575fc);
          color: #ffffff;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 2rem;
          text-align: center;
        }
        .left-panel img {
          max-width: 65%;
          margin-bottom: 1.5rem;
        }
        .left-panel h1 {
          font-size: 2.8rem;
          font-weight: 700;
          letter-spacing: 1px;
        }
        .right-panel {
          flex: 1;
          background-color: #ffffff;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 2rem;
        }
        .login-box {
          width: 100%;
          max-width: 420px;
          padding: 2rem;
          border-radius: 1rem;
          box-shadow: 0 0 1rem rgba(0, 0, 0, 0.1);
          background-color: #ffffff;
        }
        .login-box h3 {
          font-weight: 600;
          color: #343a40;
        }
        .error-message {
          color: #dc3545;
          font-size: 0.9rem;
          margin-bottom: 1rem;
          text-align: center;
        }
    </style>
</head>
<body>
<div class="split-layout">
    <div class="left-panel">
        <img src="https://www.svgrepo.com/show/331445/team-discussion-communication.svg" alt="Illustration">
        <h1>Counsellor Management Portal</h1>
    </div>
    <div class="right-panel">
        <div class="login-box">
            <h3 class="mb-4 text-center">Login</h3>
            <!-- Login error message -->
            <div class="error-message" th:text="${ErrorMassage}">
                <i class="bi bi-exclamation-circle"></i>
            </div>
            <form method="post" action="/login" th:object="${counsellor}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="username" placeholder="Enter email" required
                    th:field="*{email}">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required
                    th:field="*{password}">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
                <div class="text-center mt-3">
                    <span>Don't have an account?</span>
                    <a href="/register" class="text-decoration-none text-primary fw-semibold">Register here</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
