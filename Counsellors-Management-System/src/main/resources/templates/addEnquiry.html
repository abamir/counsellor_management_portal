<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Enquiry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
          font-family: 'Inter', sans-serif;
          background: #f3f4f6;
        }
        .navbar {
          background-color: #4f46e5 !important;
        }
        .navbar-brand,
        .nav-link,
        .navbar-text {
          color: #ffffff !important;
        }
        .btn-outline-danger {
          border-color: #ffffff;
          color: #ffffff;
        }
        .btn-outline-danger:hover {
          background-color: #ef4444;
          color: #fff;
        }
        .card {
          border: none;
          background: #ffffff;
        }
        .card-header {
          background: #4f46e5;
        }
        .btn-primary {
          background-color: #4f46e5;
          border-color: #4f46e5;
        }
        .btn-primary:hover {
          background-color: #4338ca;
          border-color: #4338ca;
        }
        .form-control, .form-select {
          border-radius: 0.75rem;
        }
        .alert {
          border-radius: 0.75rem;
        }
    </style>
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Home</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/Enquiry">Add Enquiry</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/viewEnquiry">View Enquiry</a>
                </li>
            </ul>
        </div>
        <div class="d-flex align-items-center">
      <span class="navbar-text me-3 d-flex align-items-center" th:text="${counsellor_Name}">
        <i class="bi bi-person-circle me-2" style="font-size: 1.5rem;"></i>
      </span>
            <form th:action="@{/logout}">
                <button class="btn btn-outline-danger" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <!-- Success and Failure Messages -->
    <div id="messageSection">
        <!-- <div class="alert alert-success d-none" role="alert" id="successMessage"
              th:if="${successMessage}"
         th:text="${successMessage}"></div>

         </div>
         <div class="alert alert-danger d-none" role="alert" id="errorMessage"
              th:if="${errorMessage}"
         th:text="${errorMessage}">-->

        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

        <!-- ❌ Error Message -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-lg rounded-4">
            <div class="card-header text-white text-center rounded-top-4">
                <h4 class="mb-0">Add Enquiry</h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/addEnquiry}" method="post" th:object="${enquiryDto}">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="name" placeholder="Name"
                                       th:field="*{name}">
                                <input type="hidden" th:field="*{enquiryId}">
                                <label for="name">Name</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="tel" class="form-control" id="phone" placeholder="Phone"
                                       th:field="*{phone}">
                                <label for="phone">Phone</label>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <div class="form-floating">
                                <select class="form-select" id="classMode" th:field="*{classMode}">
                                    <option value="" selected disabled>Choose...</option>
                                    <option value="Online">Online</option>
                                    <option value="Offline">Offline</option>
                                    <option value="Hybrid">Hybrid</option>
                                </select>
                                <label for="classMode">Class Mode</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-floating">
                                <select class="form-select" id="courseName" th:field="*{courseName}">
                                    <option value="" selected disabled>Choose...</option>
                                    <option value="Java">Java</option>
                                    <option value="Python">Python</option>
                                    <option value="DevOps">DevOps</option>
                                    <option value="Web Development">Web Development</option>
                                </select>
                                <label for="courseName">Course Name</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-floating">
                                <select class="form-select" id="status" th:field="*{enqStatus}">
                                    <option value="" selected disabled>Choose...</option>
                                    <option value="Open">Open</option>
                                    <option value="Enrolled">Enrolled</option>
                                    <option value="Lost">Lost</option>
                                </select>
                                <label for="status">Status</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                            Submit Enquiry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
