<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
          background-color: #f0f2f5;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .dashboard-heading {
          font-size: 2.5rem;
          font-weight: 700;
          color: #343a40;
          margin-bottom: 2rem;
        }
        .card {
          border: none;
          border-radius: 1rem;
          box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.1);
          transition: transform 0.3s ease;
        }
        .card:hover {
          transform: translateY(-6px);
        }
        .card-title {
          font-size: 1.1rem;
          font-weight: 600;
          color: #fff;
        }
        .card-value {
          font-size: 2rem;
          font-weight: bold;
          color: #fff;
        }
        .card-title i {
          margin-right: 0.5rem;
        }
        .bg-indigo { background-color: #6366f1; }
        .bg-teal { background-color: #14b8a6; }
        .bg-amber { background-color: #f59e0b; }
        .bg-rose { background-color: #f43f5e; }
    </style>
</head>
<body>
<!-- Top Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Home</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="Enquiry">Add Enquiry</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/viewEnquiry">View Enquiry</a>
                </li>
            </ul>
        </div>

         <div class="d-flex align-items-center">
        <!-- User Icon and Name -->
        <span class="navbar-text text-light me-3 d-flex align-items-center"
              th:text="${counsellor.name}">
        <!-- User Icon -->
        <i class="bi bi-person-circle me-2" style="font-size: 1.5rem;"></i>
            <!-- Logged-in User's Name -->

      </span>
        <!-- Logout Button -->
        <form th:action="@{/logout}">
        <button class="btn btn-outline-danger" type="submit">Logout</button>
        </form>
    </div>
    </div>
</nav>

<div class="container-fluid py-4">
    <h2 class="dashboard-heading text-center">Admin Dashboard</h2>
    <div class="row g-4">
        <div class="col-md-6 col-xl-3">
            <div class="card bg-indigo">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-person-badge-fill"></i>Total Counsellors</h5>
                    <p class="card-value" th:text="${dashboardInfo.totalEnquiries}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl-3">
            <div class="card bg-teal">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-chat-left-text-fill"></i>Open Enquiries</h5>
                    <p class="card-value" th:text="${dashboardInfo.openEnquiries}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl-3">
            <div class="card bg-amber">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-people-fill"></i>Enquiries Enrolled</h5>
                    <p class="card-value" th:text="${dashboardInfo.enrolledEnquiries}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-xl-3">
            <div class="card bg-rose">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-calendar2-event-fill"></i>Lost Enquiries</h5>
                    <p class="card-value" th:text="${dashboardInfo.lostEnquiries}"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
